<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ committee_name }} - 报名数据统计</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>{{ committee_name }}</h1>
            <p class="update-time" id="updateTime">加载中...</p>
            <a href="/" class="back-link">← 返回主页</a>
        </header>

        <div class="committee-stats">
            <div class="stat-card capacity" id="capacityCard">
                <h3>会场容量</h3>
                <p class="stat-number" id="capacity">-</p>
            </div>
        </div>

        <div class="committee-intro">
            <h2>会场介绍</h2>
            <div class="intro-content" id="introContent">
                <p>会场介绍内容加载中...</p>
            </div>
        </div>

        <div class="navigation">
            <h3>其他会场</h3>
            <div class="committees-list">
                {% for committee in committees %}
                    {% if committee != committee_name %}
                    <a href="/committee/{{ committee|urlencode }}" class="committee-link">{{ committee }}</a>
                    {% endif %}
                {% endfor %}
            </div>
        </div>
    </div>

    <script>
        const committeeName = {{ committee_name|tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/committee.js') }}"></script>
</body>
</html>
