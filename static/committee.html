<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <title>会场详情 - 报名数据统计</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="committee-page">
    <div class="container">
        <header>
            <h1 id="committeeTitle">加载中...</h1>
            <p class="update-time" id="updateTime">加载中...</p>

        <div class="committee-intro">

            <div class="intro-content" id="introContent">

            </div>

        <div class="navigation">

            <div class="committees-list" id="committeesList">
                <p>加载中...</p>
            </div>
        </div>
    </div>

    <script src="/js/committee.js"></script>

</html>
